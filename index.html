<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS • Digital Realm</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <style>
        :root {
            --neon-cyan: #00f5ff;
            --neon-purple: #c026d3;
            --neon-pink: #ff00aa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
        }

        .nav a {
            color: #ddd;
            text-decoration: none;
            margin-left: 2rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav a:hover {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        .hero-content {
            max-width: 900px;
            padding: 0 20px;
            z-index: 10;
        }

        .hero h1 {
            font-size: clamp(3.5rem, 8vw, 7rem);
            font-weight: 900;
            line-height: 1.05;
            margin-bottom: 1.5rem;
            background: linear-gradient(90deg, #ffffff, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 3s ease-in-out infinite alternate;
        }

        .hero p {
            font-size: 1.4rem;
            margin-bottom: 3rem;
            opacity: 0.85;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-button {
            padding: 1.1rem 3rem;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            border-radius: 9999px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple));
            color: white;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 245, 255, 0.5);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .cta-button:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 0 50px rgba(0, 245, 255, 0.8);
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 20px var(--neon-cyan)); }
            to { filter: drop-shadow(0 0 40px var(--neon-purple)); }
        }

        .glass-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>

    <header class="header">
        <div class="logo">NEXUS</div>
        <nav class="nav">
            <a href="#">Manifesto</a>
            <a href="#">Universe</a>
            <a href="#">Connect</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>ENTER THE<br>DIGITAL VEIL</h1>
            <p>A breathtaking fusion of art, technology, and consciousness. Built with pure HTML, CSS &amp; Three.js.</p>
            <button class="cta-button" onclick="alert('Welcome to the future ✨')">EXPLORE THE VOID</button>
        </div>
    </section>

    <script>
        // Three.js Interactive Particle Web
        let scene, camera, renderer;
        let particles, particlePositions, lines;
        let mouse = { x: 0, y: 0 };
        let targetMouse = { x: 0, y: 0 };

        function init() {
            const canvas = document.getElementById('bg');
            
            // Scene setup
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ 
                canvas: canvas, 
                antialias: true, 
                alpha: true 
            });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            camera.position.z = 45;

            // Particle system
            const particleCount = 1800;
            const geometry = new THREE.BufferGeometry();
            particlePositions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                const radius = 60;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                
                particlePositions[i]     = radius * Math.sin(phi) * Math.cos(theta);
                particlePositions[i + 1] = radius * Math.sin(phi) * Math.sin(theta);
                particlePositions[i + 2] = radius * Math.cos(phi);

                // Neon colors
                colors[i]     = 0.2 + Math.random() * 0.8;
                colors[i + 1] = 0.9;
                colors[i + 2] = 0.95;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.18,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // Connection lines
            const lineMaterial = new THREE.LineBasicMaterial({
                color: 0x00f5ff,
                transparent: true,
                opacity: 0.12,
                blending: THREE.AdditiveBlending
            });

            lines = new THREE.Group();
            scene.add(lines);

            // Mouse interaction
            window.addEventListener('mousemove', (e) => {
                targetMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                targetMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function updateConnections() {
            // Clear old lines
            while (lines.children.length > 0) {
                lines.remove(lines.children[0]);
            }

            const positions = particles.geometry.attributes.position.array;
            const maxDistance = 12;

            for (let i = 0; i < positions.length; i += 3) {
                for (let j = i + 3; j < positions.length; j += 3) {
                    const dx = positions[i] - positions[j];
                    const dy = positions[i + 1] - positions[j + 1];
                    const dz = positions[i + 2] - positions[j + 2];
                    const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);

                    if (distance < maxDistance) {
                        const geometry = new THREE.BufferGeometry().setFromPoints([
                            new THREE.Vector3(positions[i], positions[i+1], positions[i+2]),
                            new THREE.Vector3(positions[j], positions[j+1], positions[j+2])
                        ]);
                        const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({
                            color: 0x00f5ff,
                            transparent: true,
                            opacity: (maxDistance - distance) / maxDistance * 0.18
                        }));
                        lines.add(line);
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // Smooth mouse follow
            mouse.x = mouse.x * 0.92 + targetMouse.x * 0.08;
            mouse.y = mouse.y * 0.92 + targetMouse.y * 0.08;

            // Gentle rotation + mouse influence
            particles.rotation.y += 0.0008;
            particles.rotation.x = mouse.y * 0.15;
            particles.rotation.z = mouse.x * 0.1;

            // Very subtle particle movement
            const positions = particles.geometry.attributes.position.array;
            for (let i = 0; i < positions.length; i += 3) {
                positions[i + 1] += Math.sin(Date.now() * 0.0005 + i) * 0.008;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // Update connections every 8 frames for performance
            if (Math.random() < 0.125) updateConnections();

            renderer.render(scene, camera);
        }

        // Initialize everything
        window.onload = init;
    </script>
</body>
</html>
