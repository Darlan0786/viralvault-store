<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS • O Véu Digital</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        :root {
            --neon-cyan: #00f5ff;
            --neon-purple: #c026d3;
            --neon-pink: #ff0088;
            --glass: rgba(10, 10, 25, 0.72);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #05050a;
            color: #e0e0ff;
            overflow-x: hidden;
            line-height: 1.6;
        }

        canvas { 
            position: fixed; 
            top: 0; 
            left: 0; 
            z-index: -1; 
            touch-action: none;
        }

        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            padding: 1.6rem 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10000;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 245, 255, 0.12);
            transition: all 0.4s ease;
        }

        .logo {
            font-size: 2.35rem;
            font-weight: 900;
            letter-spacing: -3.5px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 245, 255, 0.5);
        }

        .nav {
            display: flex;
            gap: 2.8rem;
        }

        .nav a {
            color: #ddd;
            text-decoration: none;
            font-weight: 500;
            position: relative;
            transition: 0.4s;
        }

        .nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background: var(--neon-cyan);
            transition: width 0.4s ease;
        }

        .nav a:hover::after {
            width: 100%;
        }

        .nav a:hover {
            color: var(--neon-cyan);
            text-shadow: 0 0 15px var(--neon-cyan);
        }

        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        .hero-content {
            max-width: 980px;
            padding: 2.5rem 2rem;
            z-index: 10;
            background: var(--glass);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }

        .hero h1 {
            font-size: clamp(4.2rem, 11vw, 8.5rem);
            font-weight: 900;
            line-height: 0.92;
            margin-bottom: 1.8rem;
            background: linear-gradient(90deg, #fff, var(--neon-cyan), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGlow 5s ease-in-out infinite alternate;
        }

        .hero p {
            font-size: 1.65rem;
            max-width: 720px;
            margin: 0 auto 3.2rem;
            opacity: 0.92;
            font-weight: 400;
        }

        .cta-button {
            padding: 1.45rem 4rem;
            font-size: 1.3rem;
            font-weight: 700;
            border: none;
            border-radius: 9999px;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
            color: white;
            cursor: pointer;
            box-shadow: 0 0 45px rgba(0, 245, 255, 0.7);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.7s;
        }

        .cta-button:hover::before {
            left: 200%;
        }

        .cta-button:hover {
            transform: translateY(-10px) scale(1.06);
            box-shadow: 0 0 80px rgba(0, 245, 255, 0.95);
        }

        @keyframes titleGlow {
            from { filter: drop-shadow(0 0 30px var(--neon-cyan)); }
            to { filter: drop-shadow(0 0 65px var(--neon-purple)); }
        }

        /* Scroll indicator */
        .scroll-down {
            position: absolute;
            bottom: 5vh;
            left: 50%;
            transform: translateX(-50%);
            color: var(--neon-cyan);
            font-size: 0.9rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>

    <header class="header">
        <div class="logo">NEXUS</div>
        <nav class="nav">
            <a href="#manifesto">Manifesto</a>
            <a href="#universo">Universo</a>
            <a href="#conectar">Conectar</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>ENTRE NO<br>VEU DIGITAL</h1>
            <p>Uma experiência 3D imersiva com partículas neon que dançam ao seu toque. Cyberpunk puro. Futuro agora.</p>
            <button class="cta-button" onclick="alert('🌌 O véu foi rompido. Bem-vindo ao NEXUS.')">
                <i class="fas fa-rocket"></i> INICIAR TRANSMISSÃO
            </button>
        </div>
        <div class="scroll-down">
            <i class="fas fa-chevron-down"></i> Role para explorar
        </div>
    </section>

    <!-- Placeholder sections for future expansion -->
    <section id="manifesto" style="height: 100vh; padding: 120px 6%; background: rgba(5,5,10,0.98); display: flex; align-items: center;">
        <div style="max-width: 800px; margin: 0 auto; text-align: center;">
            <h2 style="font-size: 3.5rem; margin-bottom: 2rem; color: var(--neon-cyan);">O Manifesto</h2>
            <p style="font-size: 1.4rem; opacity: 0.9;">Nós não construímos sites. Nós criamos portais para o futuro.</p>
        </div>
    </section>

    <script>
        let scene, camera, renderer, particles, linesGroup;
        let mouse = { x: 0, y: 0 };
        let targetMouse = { x: 0, y: 0 };
        let frameCount = 0;

        function init() {
            const canvas = document.getElementById('bg');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 250);
            renderer = new THREE.WebGLRenderer({ 
                canvas, 
                antialias: true, 
                alpha: true,
                powerPreference: "high-performance"
            });
            
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.8));
            camera.position.z = 52;

            // Particles - more refined
            const count = 2600;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                const radius = 72 + Math.random() * 8;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                positions[i]     = radius * Math.sin(phi) * Math.cos(theta);
                positions[i + 1] = radius * Math.sin(phi) * Math.sin(theta) * 0.75;
                positions[i + 2] = radius * Math.cos(phi) * 0.9;

                const intensity = 0.6 + Math.random() * 0.4;
                colors[i]     = intensity * 0.3;
                colors[i + 1] = intensity * 0.9;
                colors[i + 2] = intensity * 1.0;
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.165,
                vertexColors: true,
                transparent: true,
                opacity: 0.96,
                blending: THREE.AdditiveBlending,
                depthTest: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // Connection lines group
            linesGroup = new THREE.Group();
            scene.add(linesGroup);

            // Mouse + Touch support
            const handlePointer = (e) => {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                targetMouse.x = (clientX / window.innerWidth) * 2 - 1;
                targetMouse.y = -(clientY / window.innerHeight) * 2 + 1;
            };

            window.addEventListener('mousemove', handlePointer);
            window.addEventListener('touchmove', handlePointer, { passive: true });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        function updateConnections() {
            while (linesGroup.children.length > 80) linesGroup.remove(linesGroup.children[0]);

            const pos = particles.geometry.attributes.position.array;
            const maxDist = 14.5;
            let connections = 0;

            for (let i = 0; i < pos.length && connections < 220; i += 9) {
                for (let j = i + 9; j < pos.length && connections < 280; j += 9) {
                    const dx = pos[i] - pos[j];
                    const dy = pos[i+1] - pos[j+1];
                    const dz = pos[i+2] - pos[j+2];
                    const dist = Math.hypot(dx, dy, dz);

                    if (dist < maxDist && dist > 2) {
                        const lineGeo = new THREE.BufferGeometry().setFromPoints([
                            new THREE.Vector3(pos[i], pos[i+1], pos[i+2]),
                            new THREE.Vector3(pos[j], pos[j+1], pos[j+2])
                        ]);
                        const opacity = (maxDist - dist) / maxDist * 0.26;
                        const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({
                            color: 0x00eeff,
                            transparent: true,
                            opacity: opacity
                        }));
                        linesGroup.add(line);
                        connections++;
                    }
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            frameCount++;

            mouse.x = mouse.x * 0.88 + targetMouse.x * 0.12;
            mouse.y = mouse.y * 0.88 + targetMouse.y * 0.12;

            // Smooth rotation with mouse influence
            particles.rotation.y += 0.00055;
            particles.rotation.x = mouse.y * 0.26;
            particles.rotation.z = mouse.x * 0.14;

            // Floating animation
            particles.position.y = Math.sin(Date.now() * 0.0007) * 2.2;

            // Performance optimized connections
            if (frameCount % 7 === 0) updateConnections();

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
